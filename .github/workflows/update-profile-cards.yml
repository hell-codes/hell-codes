name: Update Profile Cards

on:
  schedule:
    - cron: "0 */6 * * *"   # refresh every 6 hours
  workflow_dispatch:         # lets you trigger it manually anytime from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=hell-codes&show_icons=true&count_private=true&include_all_commits=true&
            bg_color=0d0000&title_color=ffd700&icon_color=cc0000&text_color=ffb700&
            border_color=8b0000&ring_color=ffd700&hide_border=false
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=hell-codes&layout=compact&langs_count=8&
            bg_color=0d0000&title_color=ffd700&text_color=ffb700&
            border_color=8b0000&hide_border=false
          path: profile/top-langs.svg
          token: ${{ secrets.PROFILE_TOKEN }}

      - name: Generate portfolio pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: >-
            username=hell-codes&repo=prabinyadav.github.io&
            bg_color=0d0000&title_color=ffd700&icon_color=cc0000&text_color=ffb700&
            border_color=8b0000&hide_border=false
          path: profile/pin.svg
          token: ${{ secrets.PROFILE_TOKEN }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet || git commit -m "chore: refresh profile stats cards"
          git push
